map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Docker's embedded DNS can return a new container IP after a rolling
# replacement. Resolve proxy destinations per request instead of pinning the
# address that existed when Nginx started.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types text/html text/css application/x-javascript text/markdown;
    set $cms_backend web:8000;
    set $static_frontend static-frontend:8001;

    location = /healthz/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /readyz/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Keep CMS endpoints on Django even when a user omits the trailing slash.
    # Otherwise /admin falls through to the static frontend and can return a
    # misleading "Static release target unavailable" response.
    location ~ ^/(admin|django-admin|documents|i18n)(/|$) {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /news/feed/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location /static/ {
        alias /srv/static/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/media/.*\.(?:md|markdown)$ {
        root /srv;
        types {
            text/markdown md markdown;
        }
        try_files $uri =404;
        expires 1h;
    }

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
        expires 1h;
    }

    location / {
        proxy_pass http://$static_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }
}
