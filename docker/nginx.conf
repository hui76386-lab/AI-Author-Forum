map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Docker's embedded DNS can return a new container IP after a rolling
# replacement. Resolve proxy destinations per request instead of pinning the
# address that existed when Nginx started.
resolver 127.0.0.11 valid=10s ipv6=off;

# Edge flood controls. The upstream CDN/WAF may be stricter, while application
# Lua limits remain authoritative for reader/email/article dimensions.
limit_req_zone $binary_remote_addr zone=reader_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=reader_verify_per_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=reader_connections_per_ip:10m;

# Nginx normalizes encoded dot segments before location matching. Inspect the
# original path and reject traversal/encoded separators on sensitive routes.
map $request_uri $reader_path_traversal {
    default 0;
    ~*^/(?:reader-api|_protected_pdf)/[^?]*(?:\.\.|%2e|%2f|%5c) 1;
}

# Reader verification tokens live in URL fragments and are never sent to the
# server. This format also omits query strings as a defense-in-depth measure.
log_format reader_api '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    sendfile on;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    charset utf-8;
    charset_types text/html text/css application/x-javascript text/markdown;
    set $cms_backend web:8000;
    set $static_frontend static-frontend:8001;

    if ($reader_path_traversal) {
        return 400;
    }

    location = /livez/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /healthz/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /readyz/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /__static_health__/ {
        proxy_pass http://$static_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        add_header X-Static-Served-By static-frontend always;
    }

    # Keep CMS endpoints on Django even when a user omits the trailing slash.
    # Otherwise /admin falls through to the static frontend and can return a
    # misleading "Static release target unavailable" response.
    location ~ ^/(admin|django-admin|documents|i18n|author|account)(/|$) {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /news/feed/ {
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Download grants are bearer capabilities. Never place their path token in logs.
    location ^~ /reader-api/v1/downloads/ {
        access_log off;
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Verification requests receive an additional edge throttle. The neutral
    # application response and HMAC/global Lua limits still apply behind it.
    location = /reader-api/v1/email-verifications/ {
        limit_req zone=reader_api_per_ip burst=20 nodelay;
        limit_req zone=reader_verify_per_ip burst=3 nodelay;
        limit_conn reader_connections_per_ip 10;
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
        access_log /var/log/nginx/access.log reader_api;
    }

    location = /reader-api/internal/v1/metrics/ {
        access_log off;
        limit_conn reader_connections_per_ip 2;
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location ^~ /reader-api/ {
        limit_req zone=reader_api_per_ip burst=40 nodelay;
        limit_conn reader_connections_per_ip 20;
        proxy_pass http://$cms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        access_log /var/log/nginx/access.log reader_api;
        client_max_body_size 64k;
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location ^~ /_protected_pdf/ {
        internal;
        alias /srv/protected-pdfs/;
        sendfile on;
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /srv/static/;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/media/.*\.(?:md|markdown)$ {
        root /srv;
        types {
            text/markdown md markdown;
        }
        try_files $uri =404;
        expires 1h;
    }

    location /media/ {
        alias /srv/media/;
        try_files $uri =404;
        expires 1h;
    }

    location = /.nginx-direct-ready {
        return 404;
    }

    location ^~ /.nginx-redirects/ {
        return 404;
    }

    location / {
        root /srv/published/current;
        set $static_candidate /__release_requires_static_frontend__;
        if (-f /srv/published/current/.nginx-direct-ready) {
            set $static_candidate $uri;
        }
        error_page 418 = @static_frontend;
        if (-f /srv/published/current/.nginx-redirects$uri/index.html.redirect) {
            return 418;
        }
        try_files $static_candidate/index.html $static_candidate @static_frontend;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Static-Release true always;
        add_header X-Static-Served-By nginx always;
    }

    location @static_frontend {
        proxy_pass http://$static_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        add_header X-Static-Served-By static-frontend always;
    }
}
