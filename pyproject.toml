[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/settings/dev.py" = ["F403", "F405"]
"scripts/generate_import_approve_place_1200_articles.py" = ["E402"]
"test-data/article-import-10-per-format-20260730/validate_fixtures.py" = ["E402"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["ai_author_forum"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ai_author_forum.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
