{% extends "author/base.html" %}
{% block title %}更换主投期刊{% endblock %}
{% block content %}<section class="author-page-heading"><div><p class="author-eyebrow">草稿设置</p><h1>更换主投期刊</h1><p class="author-muted">{{ article.title }} · 首次提交前可执行一次或多次更换。</p></div></section><form method="post" class="author-form author-form--card">{% csrf_token %}{{ form.non_field_errors }}{{ form.expected_revision_id }}{{ form.request_id }}<label>{{ form.target_journal.label }}{{ form.target_journal }}{{ form.target_journal.errors }}</label><label>{{ form.target_category.label }}{{ form.target_category }}{{ form.target_category.errors }}</label><label class="author-check">{{ form.confirmed }} {{ form.confirmed.label }}</label><div class="author-actions"><a class="author-button" href="{% url 'author:detail' article.pk %}">取消</a><button class="author-button author-button--accent" type="submit">确认更换并保存</button></div></form>{% endblock %}
