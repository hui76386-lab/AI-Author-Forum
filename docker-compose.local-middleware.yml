# Optional local middleware overlay for development/isolated acceptance only.
# Use together with docker-compose.production.yml and
# .env.production.local.example. Production defaults to remote middleware.
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_author_forum
      POSTGRES_USER: ai_author_forum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      INTERACTIONS_POSTGRES_DB: ${INTERACTIONS_POSTGRES_DB:-ai_author_forum_interactions}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-interactions-db.sh:/docker-entrypoint-initdb.d/20-interactions-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_author_forum -d ai_author_forum"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  release:
    depends_on:
      database:
        condition: service_healthy

  worker:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  reader-email-worker:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  reader-comments-worker:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  reader-pdf-worker:
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
